name: Validate Miluaistudio

on:
  push:
    branches:
      - work/miluaistudio-catalogo-20261026
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ESLint Next config referenced by the existing config
        run: npm install --no-save --package-lock=false eslint-config-next@16.1.1

      - name: Lint
        run: npm run lint

      - name: Build static site
        run: npm run build
